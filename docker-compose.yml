services:

  db:
    image: postgres:16-alpine
    container_name: nemia-db
    environment:
      POSTGRES_DB: nemia_hub
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nemia-network

