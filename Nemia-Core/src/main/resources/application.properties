# Configuration dynamique pour le déploiement
spring.datasource.url=jdbc:postgresql://localhost:5433/nemia_hub
spring.datasource.username=nemia
spring.datasource.password=nemia2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#Security key
JWT_SECRET=nemia-dev-secret-key-must-be-at-least-32-chars
